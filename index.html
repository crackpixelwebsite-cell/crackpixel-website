<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crackpixel Admin</title><link rel="icon" type="image/svg+xml" href="../favicon.svg"><meta name="robots" content="noindex"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0c;color:#eee;font:14px Arial}a{color:#e7b342;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:62px;background:#111;border-bottom:1px solid #292929;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-size:20px;font-weight:800}.brand span{color:#e7b342}.btn{background:#171717;border:1px solid #393939;color:#eee;border-radius:6px;padding:9px 13px}.gold{background:#c58b24!important;color:#111!important;font-weight:700}.danger{color:#ffaaa0}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.card{background:#121213;border:1px solid #292929;border-radius:8px;padding:20px}.box{width:min(420px,100%)}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;padding:10px;background:#0b0b0c;border:1px solid #333;color:#eee;border-radius:6px}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 62px)}aside{background:#101011;border-right:1px solid #292929;padding:15px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#bbb;padding:11px;border-radius:6px;margin:3px 0}.nav.on,.nav:hover{background:#1d1d1e;color:#fff}.main{padding:25px;max-width:1200px;width:100%;margin:auto}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title h1{margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#121213;border:1px solid #292929;border-radius:8px;padding:17px}.stat b{display:block;font-size:26px;margin-top:7px}.card{margin-top:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #252525;padding:12px 0}.row:first-child{border-top:0}.muted{color:#888}.actions{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:4px 8px;border-radius:15px;background:#222}.answers{background:#0c0c0d;border-radius:6px;padding:12px;margin:12px 0}.answer{border-top:1px solid #252525;padding:9px 0}.answer:first-child{border-top:0}.answer small{color:#888}.answer p{white-space:pre-wrap;margin:5px 0}.err{background:#321919;border:1px solid #6b3030;color:#ffb1b1;padding:10px;border-radius:6px;margin:10px 0}.hidden{display:none!important}.form label{display:flex;gap:8px;align-items:center;color:#ccc}.form input[type=checkbox]{width:auto;padding:0}.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.role{background:#2a2110;color:#e7b342;border:1px solid #5b4516}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.main{padding:14px}.top{padding:0 14px}}
</style></head><body>
<div id="login" class="login"><div class="box"><div class="brand">CRACK<span>PIXEL</span> ADMIN</div><h1>Admin login</h1><p class="muted">Use your Supabase administrator account.</p><div id="err"></div><form id="lf" class="form"><input id="email" type="email" placeholder="Email" required><input id="pass" type="password" placeholder="Password" required><button class="btn gold">Sign in</button></form><p><a href="../">← Back to site</a></p></div></div>
<div id="admin" class="hidden"><header class="top"><div class="brand">CRACK<span>PIXEL</span> ADMIN</div><div class="actions"><span class="pill role" id="role"></span><a class="btn" href="../">View site</a><button class="btn" id="out">Sign out</button></div></header><div class="layout"><aside id="side"></aside><main id="main" class="main"></main></div></div>
<script>
const CFG={url:'https://utqmyvttfmaidxhzsisg.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0cW15dnR0Zm1haWR4aHpzaXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMDM0NTUsImV4cCI6MjEwNjc3OTQ1NX0.K-J2PvUwV1J8tDcnJ5U4qSZZbjh4SsZx6ccr7xx5-cA'};
const sb=supabase.createClient(CFG.url,CFG.key),$=x=>document.getElementById(x);let D={},tab='dash',P=[];const TABS=[['dash','Dashboard',''],['apps','Applications','apps'],['staff','Staff','staff'],['news','News','news'],['forums','Forums','forums'],['subs','Subusers','subusers']];const PERMS=[['apps','Applications + apps ON/OFF'],['staff','Staff team'],['news','News'],['forums','Forum moderation']];const can=p=>!p||P.includes(p);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>x?new Date(x).toLocaleString():'';
async function admin(){let r=await sb.rpc('is_admin');if(r.error){throw new Error('is_admin() failed: '+r.error.message+' - did you run supabase/schema.sql in the SQL Editor?')}return r.data===true}async function get(t){let r=await sb.from(t).select('*').order('created_at',{ascending:false});if(r.error)throw r.error;return r.data||[]}async function load(){D.apps=can('apps')?await get('apps'):[];if(can('subusers')){let r=await sb.rpc('list_subusers');if(r.error)throw r.error;D.subs=r.data||[]}D.staff=await get('staff');D.news=await get('news');D.threads=await get('threads');let r=await sb.from('settings').select('*');D.settings=r.data||[];render()}
function openApps(){let x=D.settings.find(x=>x.key==='apps_open');return !(x&&x.value==='false')}function nav(t){if(t!=='dash'&&!can(TABS.find(x=>x[0]===t)[2]))return;tab=t;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));render()}
function render(){if(tab==='dash')dash();if(tab==='apps')apps();if(tab==='staff')staff();if(tab==='news')news();if(tab==='forums')forums();if(tab==='subs')subs()}
function head(t){$('main').innerHTML=`<div class="title"><div><h1>${t}</h1><div class="muted">${esc(D.email||'')}</div></div></div>`}
function dash(){head('Dashboard');let st=[['Applications',D.apps.length,'apps'],['Staff',D.staff.length,''],['News',D.news.length,''],['Threads',D.threads.length,''],['Subusers',(D.subs||[]).length,'subusers']].filter(x=>can(x[2]));$('main').innerHTML+=`<div class="grid">${st.map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('')}</div>`+(can('apps')?`<div class="card"><h2>Applications</h2><p>Applications are <b>${openApps()?'OPEN':'CLOSED'}</b>.</p><button class="btn ${openApps()?'danger':'gold'}" onclick="toggleApps()">${openApps()?'Close applications':'Open applications'}</button></div>`:'')}
function apps(){head('Staff applications');$('main').innerHTML+=`<div class="card"><h2>All applications (${D.apps.length})</h2>${D.apps.map(a=>`<div class="row"><div><b>${esc(a.ign)}</b><div class="muted">${esc(a.discord||'No Discord')} · age ${esc(a.age||'?')} · ${fmt(a.created_at)}</div></div><div class="actions"><span class="pill">${esc(a.status)}</span><button class="btn" onclick="view(${a.id})">View</button></div></div>`).join('')||'<div class="muted">No applications yet.</div>'}</div>`}
function view(id){let a=D.apps.find(x=>x.id===id);let an=a.answers||{};$('main').insertAdjacentHTML('afterbegin',`<div class="card" id="detail"><div class="title"><h1>${esc(a.ign)} application</h1><button class="btn" onclick="detail.remove()">Close</button></div><div class="answers">${Object.entries(an).map(([k,v])=>`<div class="answer"><small>${esc(k)}</small><p>${esc(v)}</p></div>`).join('')}</div><div class="actions"><button class="btn gold" onclick="accept(${id})">Accept + Helper</button><button class="btn" onclick="deny(${id})">Deny</button><button class="btn danger" onclick="delApp(${id})">Delete</button></div></div>`)}
async function accept(id){let a=D.apps.find(x=>x.id===id);await sb.from('apps').update({status:'accepted'}).eq('id',id);if(a&&!D.staff.some(s=>s.ign.toLowerCase()===a.ign.toLowerCase()))await sb.from('staff').insert({ign:a.ign,rank:'Helper'});await load()}async function deny(id){await sb.from('apps').update({status:'denied'}).eq('id',id);await load()}async function delApp(id){if(confirm('Delete application?')){await sb.from('apps').delete().eq('id',id);await load()}}async function toggleApps(){await sb.from('settings').upsert({key:'apps_open',value:openApps()?'false':'true'});await load()}
function staff(){head('Staff team');$('main').innerHTML+=`<div class="card"><h2>Add staff</h2><form id="sf" class="form"><input id="ign" maxlength="16" placeholder="Minecraft IGN" required><select id="rank"><option>Owner</option><option>Dev</option><option>Admin</option><option>Gamemaster</option><option>Mod</option><option>Helper</option></select><button class="btn gold">Add staff</button></form></div><div class="card"><h2>Current staff</h2>${D.staff.map(s=>`<div class="row"><div><b>${esc(s.ign)}</b><div class="muted">${esc(s.rank)}</div></div><div class="actions"><button class="btn" onclick="editStaff(${s.id})">Edit</button><button class="btn danger" onclick="removeStaff(${s.id})">Remove</button></div></div>`).join('')}</div>`;$('sf').onsubmit=async e=>{e.preventDefault();let r=await sb.from('staff').insert({ign:$('ign').value.trim(),rank:$('rank').value});if(r.error)alert(r.error.message);else load()}}
async function editStaff(id){let s=D.staff.find(x=>x.id===id),n=prompt('New IGN',s.ign);if(n&&n.trim()){await sb.from('staff').update({ign:n.trim()}).eq('id',id);load()}}async function removeStaff(id){if(confirm('Remove staff member?')){await sb.from('staff').delete().eq('id',id);load()}}
async function reloadSubs(){let r=await sb.rpc('list_subusers');if(r.error){alert(r.error.message);return}D.subs=r.data||[];subs()}
function subs(){head('Subusers');$('main').innerHTML+=`<div class="card"><h2>Add subuser</h2><p class="muted">Only emails that are already <b>registered</b> on the site can be added. They sign in here with their normal account and only see the tabs you tick.</p><form id="uf" class="form"><input id="ue" type="email" placeholder="Registered email" required>${PERMS.map(p=>`<label><input type="checkbox" class="pc" value="${p[0]}"> ${p[1]}</label>`).join('')}<div class="actions"><button class="btn gold" id="ub">Add subuser</button><button type="button" class="btn hidden" id="uc" onclick="subs()">Cancel edit</button></div></form></div><div class="card"><h2>Current subusers (${D.subs.length})</h2>${D.subs.map((u,i)=>`<div class="row"><div><b>${esc(u.ign||u.email)}</b><div class="muted">${esc(u.email)}</div><div class="pills">${(u.perms||[]).map(p=>`<span class="pill">${esc((PERMS.find(x=>x[0]===p)||[p,p])[1])}</span>`).join('')||'<span class="muted">no permissions</span>'}</div></div><div class="actions"><button class="btn" onclick="editSub(${i})">Edit</button><button class="btn danger" onclick="delSub(${i})">Remove</button></div></div>`).join('')||'<div class="muted">No subusers yet.</div>'}</div>`;$('uf').onsubmit=async e=>{e.preventDefault();let r=await sb.rpc('add_subuser',{p_email:$('ue').value.trim(),p_perms:[...document.querySelectorAll('.pc:checked')].map(x=>x.value)});if(r.error)alert(r.error.message);else reloadSubs()}}
function editSub(i){let u=D.subs[i];$('ue').value=u.email;$('ue').readOnly=true;document.querySelectorAll('.pc').forEach(c=>c.checked=(u.perms||[]).includes(c.value));$('ub').textContent='Save permissions';$('uc').classList.remove('hidden');$('uf').scrollIntoView({behavior:'smooth'})}
async function delSub(i){let u=D.subs[i];if(confirm('Remove '+u.email+' as subuser?')){let r=await sb.from('subadmins').delete().eq('email',u.email);if(r.error)alert(r.error.message);else reloadSubs()}}
function news(){head('News');$('main').innerHTML+=`<div class="card"><h2>Publish news</h2><form id="nf" class="form"><input id="nt" placeholder="Title" required><textarea id="nb" rows="4" placeholder="Body" required></textarea><button class="btn gold">Publish</button></form></div><div class="card"><h2>Published news</h2>${D.news.map(n=>`<div class="row"><div><b>${esc(n.title)}</b><div class="muted">${esc(n.author||'Admin')} · ${fmt(n.created_at)}</div></div><button class="btn danger" onclick="delNews(${n.id})">Delete</button></div>`).join('')}</div>`;$('nf').onsubmit=async e=>{e.preventDefault();let r=await sb.from('news').insert({title:$('nt').value.trim(),author:D.email,body:$('nb').value.trim()});if(r.error)alert(r.error.message);else load()}}
async function delNews(id){if(confirm('Delete news?')){await sb.from('news').delete().eq('id',id);load()}}
function forums(){head('Forum moderation');$('main').innerHTML+=`<div class="card"><h2>Threads</h2>${D.threads.map(t=>`<div class="row"><div><b>${esc(t.title)}</b><div class="muted">${esc(t.ign)} · ${esc(t.cat)} · ${fmt(t.created_at)}</div></div><button class="btn danger" onclick="delThread(${t.id})">Delete</button></div>`).join('')||'<div class="muted">No threads.</div>'}</div>`}async function delThread(id){if(confirm('Delete thread?')){await sb.from('threads').delete().eq('id',id);load()}}
$('lf').onsubmit=async e=>{e.preventDefault();$('err').innerHTML='';let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error){$('err').innerHTML=`<div class="err">${esc(r.error.message)}</div>`;return}try{await start()}catch(x){$('err').innerHTML=`<div class="err">${esc(x.message)}</div>`}};$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function start(){let s=(await sb.auth.getSession()).data.session;if(!s)return;let r=await sb.rpc('my_perms');if(r.error)throw new Error('my_perms() failed: '+r.error.message+' - run supabase/migration-subusers.sql in the SQL Editor.');P=r.data||[];if(!P.length){await sb.auth.signOut();$('err').innerHTML='<div class="err">Signed in, but this account has no admin access. Ask the main admin to add your email as a subuser (you must be registered first).</div>';return}D.email=s.user.email;$('role').textContent=P.includes('subusers')?'Main admin':'Subuser';$('side').innerHTML=TABS.filter(t=>can(t[2])).map(t=>`<button class="nav${t[0]==='dash'?' on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>nav(x.dataset.tab));$('login').classList.add('hidden');$('admin').classList.remove('hidden');await load()}start().catch(e=>{$('err').innerHTML=`<div class="err">${esc(e.message)}</div>`});
</script></body></html>
